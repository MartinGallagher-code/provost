[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provost"
dynamic = ["version"]
description = "Turn command output into data: capture, auto-detect the format, present as a tidy git-backed dataset"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Martin J. Gallagher" }]
maintainers = [{ name = "Martin J. Gallagher" }]
keywords = ["cli", "capture", "dataset", "tsv", "tidy-data", "command-output"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Unix Shell",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/MartinGallagher-code/provost"
Documentation = "https://github.com/MartinGallagher-code/provost/blob/main/docs/usage.md"
Repository = "https://github.com/MartinGallagher-code/provost"
Changelog = "https://github.com/MartinGallagher-code/provost/blob/main/CHANGELOG.md"
Issues = "https://github.com/MartinGallagher-code/provost/issues"

# The tiny-LM layout labeller for --model: numpy and the model's weights,
# which live in their own package (github.com/MartinGallagher-code/provost_model).
[project.optional-dependencies]
lm = ["numpy", "provost-model"]

[project.scripts]
provost = "provost_data:main"

# The top-level VERSION file is the single source of truth for the version.
[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = '^\s*(?P<version>\S+)\s*$'

# The wheel carries the Bash tree under provost_data/_bundle; the launcher execs
# it in place, exactly like a git-checkout install. Runtime subpaths are listed
# individually because hatchling's exclude patterns do not apply to
# force-include — this is how test/sample/dev trees stay out of the wheel. A
# new runtime subdir under extract/ or analyze/ must be added here.
[tool.hatch.build.targets.wheel]
packages = ["src/provost_data"]

[tool.hatch.build.targets.wheel.force-include]
"provost" = "provost_data/_bundle/provost"
"VERSION" = "provost_data/_bundle/VERSION"
"extract/provost-extract" = "provost_data/_bundle/extract/provost-extract"
"extract/hints.tsv" = "provost_data/_bundle/extract/hints.tsv"
"extract/manifests" = "provost_data/_bundle/extract/manifests"
"extract/lib" = "provost_data/_bundle/extract/lib"
"extract/strategies" = "provost_data/_bundle/extract/strategies"
"extract/model/layout_model.py" = "provost_data/_bundle/extract/model/layout_model.py"
"extract/model/lm_runtime.py" = "provost_data/_bundle/extract/model/lm_runtime.py"
"extract/model/lm_numpy.py" = "provost_data/_bundle/extract/model/lm_numpy.py"
"extract/model/lm_encode.py" = "provost_data/_bundle/extract/model/lm_encode.py"
"extract/model/bpe.py" = "provost_data/_bundle/extract/model/bpe.py"
"extract/model/layout.py" = "provost_data/_bundle/extract/model/layout.py"
"extract/model/features.py" = "provost_data/_bundle/extract/model/features.py"
"extract/model/decode.py" = "provost_data/_bundle/extract/model/decode.py"
"extract/model/align.py" = "provost_data/_bundle/extract/model/align.py"
"extract/model/arbitrate.py" = "provost_data/_bundle/extract/model/arbitrate.py"
"extract/model/arbiter.json" = "provost_data/_bundle/extract/model/arbiter.json"
"extract/model/layout-model.json.gz" = "provost_data/_bundle/extract/model/layout-model.json.gz"
"extract/llm/template.py" = "provost_data/_bundle/extract/llm/template.py"
"extract/llm/sandbox.py" = "provost_data/_bundle/extract/llm/sandbox.py"
"extract/llm/GUIDE.md" = "provost_data/_bundle/extract/llm/GUIDE.md"
"extract/llm/JUDGE.md" = "provost_data/_bundle/extract/llm/JUDGE.md"
"extract/llm/templates" = "provost_data/_bundle/extract/llm/templates"
"extract/README.md" = "provost_data/_bundle/extract/README.md"
"analyze/provost-analyze" = "provost_data/_bundle/analyze/provost-analyze"
"analyze/lib" = "provost_data/_bundle/analyze/lib"
"analyze/profiles" = "provost_data/_bundle/analyze/profiles"
"analyze/schemas" = "provost_data/_bundle/analyze/schemas"
"transform/melt.sh" = "provost_data/_bundle/transform/melt.sh"
"lib" = "provost_data/_bundle/lib"
"completions" = "provost_data/_bundle/completions"
"man" = "provost_data/_bundle/man"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "provost",
    "VERSION",
    "extract",
    "analyze",
    "transform",
    "lib",
    "completions",
    "man",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "LICENSES",
    "REUSE.toml",
    "tests/python",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src"]
addopts = "--cov=provost_data --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["provost_data"]

[tool.coverage.report]
fail_under = 100
show_missing = true
