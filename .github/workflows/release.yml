# Publish provost to PyPI via Trusted Publishing (OIDC — no API token).
# One-time setup on https://pypi.org/manage/account/publishing/:
#   project: provost, owner: MartinGallagher-code, repo: provost,
#   workflow: release.yml, environment: pypi
# The GitHub repo has been renamed glean -> provost; a publisher still
# registered against repo "glean" fails the OIDC exchange with
# `invalid-publisher` (PyPI matches the token's repository claim, which is
# now MartinGallagher-code/provost). Update the publisher on PyPI to match.
# Then publishing a GitHub release (or dispatching this workflow) uploads the
# sdist + wheel built from the tagged commit.
name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          provost --version
          provost doctor
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
