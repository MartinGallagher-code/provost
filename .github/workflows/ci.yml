name: CI

# Cost control (this repo is private, so Actions minutes are billed):
#
#   * `push` is limited to main. A bare `push:` alongside `pull_request:`
#     ran the whole 8-job workflow TWICE for every commit on a PR branch --
#     once for each event, on the same SHA. Every other repo in the suite
#     already filtered this way; this one did not, and it is the private one.
#   * `concurrency` cancels a run that a newer push has already superseded,
#     so three commits in a row cost one run rather than three.
#   * every job below carries `timeout-minutes`. Without one a hung job runs
#     to GitHub's 6-hour default: run #602 did exactly that, burning about
#     six hours across seven jobs before it was cancelled.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every change moves the version (shared_tools BN-002): VERSION and the
  # man page header agree, CHANGELOG.md opens with that version, and it is
  # greater than the base branch's (a pull request) or than main's before
  # the push (a push to main). tests/check_version.sh is shared_tools'
  # templates/check_version.sh with this repository's places.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every place the version is written agrees
        run: bash tests/check_version.sh
      - name: The version moved past the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          bash tests/check_version.sh FETCH_HEAD
      - name: The version moved past main's before this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --depth=1 origin "$BEFORE"
          bash tests/check_version.sh FETCH_HEAD

  smoke:
    name: smoke (end-to-end)
    runs-on: ubuntu-latest
    # 15, not 10: the core part also runs on a SHA-256 store and signed (PV-027)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: git and ssh-keygen (SHA-256 stores need git 2.29, SSH signing 2.34)
        run: git --version && ssh -V
      - name: provost doctor
        run: bash provost doctor || true
      - name: smoke test
        run: bash tests/smoke.sh

  integrations:
    # The test-framework recipes in docs/integrations/ (PV-023), each run as
    # a user would run it, so the pages cannot rot. ReFrame is pinned to the
    # version the recipe was written against, and installed here only: it is
    # never a dependency of provost. PROVOST_INTEGRATIONS_REQUIRE=1 makes a
    # missing tool a failure rather than a skip.
    name: integration recipes (ReFrame, pytest, GitLab CI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install reframe-hpc==4.7.4 pytest pyyaml
      - name: run every recipe against a stand-in
        env:
          PROVOST_INTEGRATIONS_REQUIRE: "1"
        run: bash tests/integrations.sh

  quick-checks:
    # These four finish in 5-21 seconds each. Run as separate jobs they cost
    # four billable minutes, because GitHub rounds EVERY job up to a whole
    # minute -- so ~39 seconds of work was billed as 4 minutes. As one job
    # they cost one. The trade is that they report as a single check rather
    # than four; a failing step still fails the job and names itself in the
    # log.
    name: quick checks (docs, transform, REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: require CHANGELOG + HANDOFF + README
        run: |
          missing=0
          for f in CHANGELOG.md HANDOFF.md README.md CLAUDE.md; do
            [ -f "$f" ] || { echo "missing $f"; missing=1; }
          done
          exit $missing
      - name: transform unit test
        run: bash transform/tests/test_melt.sh
      - name: units unit test (--units base, PV-032)
        run: bash transform/tests/test_units.sh
      # stdlib only (no numpy/torch): the layout-model label builders
      - name: layout-model training-set tests
        run: python3 -m unittest discover -s ml/tests -v
      - name: REUSE licensing lint
        uses: fsfe/reuse-action@v5
      # Every [project.urls] link PyPI shows must resolve (PV-034: the
      # Documentation link was a 404 for a release before anyone noticed).
      - name: project URLs resolve
        run: python3 tools/check-project-urls.py

  corpus-goldens:
    # ~3,500 frozen tidy outputs of real tools: the only thing that catches a
    # parser change silently re-shaping another tool's output. ~3 min on 4
    # cores (job pool, --generic only); private-repo runners have 2, so the
    # timeout allows ~3x that.
    #
    # FULL MODE (PV-037): --generic is not what users get. When a change can
    # alter tidy output (the engine, the transform, the shared libs, the
    # corpus, or this file), the same job also runs the full-mode check: every
    # input whose full-mode winner is not --generic's must be recorded in
    # tests/corpus/full-mode.tsv with a reason, and must keep meeting
    # expected.tsv (or its recorded shape). It shares the generic pass and
    # adds one full pass: ~4 more minutes on 4 cores, so the timeout doubles.
    name: corpus goldens (tidy output of ~3,500 real tools)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: does the change reach tidy output?
        id: scope
        run: |
          # HEAD^1 is the base: a pull request is checked out as its merge
          # commit, and a push to main is the merge (or squash) itself.
          if ! git rev-parse -q --verify HEAD^1 >/dev/null; then full=1
          elif git diff --name-only HEAD^1 HEAD | grep -qE '^(extract/|transform/|lib/|tests/corpus/|\.github/workflows/ci\.yml$)'; then full=1
          else full=0; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "full-mode check: $([ "$full" = 1 ] && echo yes || echo 'no (nothing it reads changed)')"
      - name: goldens (--generic)
        if: steps.scope.outputs.full != '1'
        run: bash tests/corpus/run.sh --golden
      - name: goldens (--generic) and the full-mode check
        if: steps.scope.outputs.full == '1'
        run: bash tests/corpus/run.sh --golden --full

  extract-suite:
    name: extract strategy + engine suite
    runs-on: ubuntu-latest
    # ~2 min locally since the 2026-09-25 detection speed-up (it was 9-17 min
    # on CI runners before). 20 minutes leaves room for a slow runner while
    # still capping a hang far below GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash extract/tests/run_tests.sh

  analyze-engine:
    name: analyze engine suite
    runs-on: ubuntu-latest
    # two full runs (mawk, then gawk), ~2.5 min each on 4 cores
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's default awk is mawk, which is what most users have, so the
      # suite runs under mawk first; then again under gawk.
      - name: run engine tests (mawk)
        run: |
          awk -W version 2>&1 | head -1
          bash analyze/tests/run_tests.sh
      - name: install gawk
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gawk
          sudo update-alternatives --set awk /usr/bin/gawk
      - name: run engine tests (gawk)
        run: bash analyze/tests/run_tests.sh

  python-package:
    name: python package (pip / PyPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pandas for provost_data.load_df's tests: without it they skip, and
      # the coverage gate fails
      - run: python -m pip install build twine pytest pytest-cov pandas
      - name: launcher and Python API unit tests (100% coverage enforced)
        run: python -m pytest
      # numpy, but no torch: the tiny LM's tokenizer, numpy runtime and export
      # quantizers (ml/tests/test_lm_numpy.py; quick-checks skips them)
      - name: the tiny LM without torch
        run: |
          python -m pip install numpy
          python -m unittest ml.tests.test_lm_numpy -v
      # textfsm (the 'provost[textfsm]' extra) and PyYAML: TextFSM templates
      # and ntc-templates' fixtures (ml/tests/test_templates.py, PV-039;
      # quick-checks skips the cases that need textfsm)
      - name: TextFSM templates
        run: |
          python -m pip install textfsm pyyaml
          python -m unittest ml.tests.test_templates -v
      - name: build sdist + wheel
        run: python -m build
      - run: python -m twine check dist/*
      - name: install the wheel and run provost from it
        run: |
          python -m pip install dist/*.whl
          provost --version
          provost doctor
          export PROVOST_HOME="$RUNNER_TEMP/provosthome"
          # not a terminal, so both captures run in the foreground
          printf 'Filesystem Size Used\n/dev/sda1 50G 20G\n' | provost
          provost ls | grep aligned-columns
          provost run df -h
          provost show df
          # the Python API reads it back through the wheel's bundled provost
          python -c "import provost_data as p; r = p.load('df'); assert r and list(r[0])[:2] == ['#', 'capture'], r; print(len(r), 'rows via load')"
          python -c "import provost_data as p; d = p.load_df('df'); assert len(d) and str(d['#'].dtype) == 'int64', d.dtypes; print(len(d), 'rows via load_df')"
          # --env reads its secret patterns (extract/secrets.tsv) from the wheel
          printf 'a,b\n1,2\n' | OMP_NUM_THREADS=8 provost --env --name envcheck
          provost source "$(provost log | tail -n 1 | awk '{print $1}')" | grep 'env.var.OMP_NUM_THREADS=8'
          # the layout model ships in the wheel: a gated capture it can read
          provost --model tests/benchmark/round3/inputs/005-cmake-cache-advanced-help.txt 2>&1 \
              | grep "strategy layout-model"
          # PROVOST_LAYOUT_LM naming no model: the LM runtime is in the wheel, finds
          # no model (and no torch here), and the trees label as before
          PROVOST_LAYOUT_LM="$RUNNER_TEMP/no-model" \
              provost --model tests/benchmark/round3/inputs/005-cmake-cache-advanced-help.txt 2>&1 \
              | grep "strategy layout-model"
          # the LLM template runtime and its shipped templates are in the wheel
          provost --llm extract/samples/llm-template/basic.txt 2>&1 \
              | grep "strategy llm-template"


  # The offline install bundle for air-gapped hosts (PV-025,
  # docs/offline-install.md): what release.yml attaches to each GitHub
  # release, built from this commit and tested the way a high-side host uses
  # it -- checksums, the SBOM against the CycloneDX 1.5 schema, one Sigstore
  # signature made and verified, and a pip install with networking off on the
  # Python floor (3.8) and on RHEL 9.
  offline-bundle:
    name: offline bundle (SBOM, checksums, signature, install with no network)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # Sigstore signs with this run's GitHub identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build "sigstore==4.5.1" "cyclonedx-python-lib[json-validation]==11.12.0"
      - name: bundle tool unit tests
        run: python -m unittest discover -s tests/offline_bundle -v
      - run: python -m build
      - name: build the bundle
        run: |
          dir="$(python tools/offline_bundle.py build --dist dist --out "$RUNNER_TEMP/bundle")"
          echo "BUNDLE=$dir" >> "$GITHUB_ENV"
          ls -l "$dir"
      - name: SHA256SUMS, SBOM coverage and the CycloneDX 1.5 schema
        run: python tools/offline_bundle.py check --schema "$BUNDLE"
      - name: sign SHA256SUMS and verify the signature
        # A pull request from a fork gets no id-token; the rest still runs.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          python -m sigstore sign "$BUNDLE/SHA256SUMS"
          python -m sigstore verify identity --cert-identity "$IDENTITY" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com "$BUNDLE/SHA256SUMS"
          python tools/offline_bundle.py check "$BUNDLE"
      - name: pack it
        run: python tools/offline_bundle.py pack "$BUNDLE"
      - name: install with networking off (Python 3.8, the floor)
        run: bash tools/offline-install-test.sh "$BUNDLE" python:3.8-slim
      - name: install with networking off (RHEL 9 UBI)
        run: bash tools/offline-install-test.sh "$BUNDLE" registry.access.redhat.com/ubi9/ubi
