name: CI

# Cost control (this repo is private, so Actions minutes are billed):
#
#   * `push` is limited to main. A bare `push:` alongside `pull_request:`
#     ran the whole 8-job workflow TWICE for every commit on a PR branch --
#     once for each event, on the same SHA. Every other repo in the suite
#     already filtered this way; this one did not, and it is the private one.
#   * `concurrency` cancels a run that a newer push has already superseded,
#     so three commits in a row cost one run rather than three.
#   * every job below carries `timeout-minutes`. Without one a hung job runs
#     to GitHub's 6-hour default: run #602 did exactly that, burning about
#     six hours across seven jobs before it was cancelled.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: provost doctor
        run: bash provost doctor || true
      - name: smoke test
        run: bash tests/smoke.sh

  quick-checks:
    # These four finish in 5-21 seconds each. Run as separate jobs they cost
    # four billable minutes, because GitHub rounds EVERY job up to a whole
    # minute -- so ~39 seconds of work was billed as 4 minutes. As one job
    # they cost one. The trade is that they report as a single check rather
    # than four; a failing step still fails the job and names itself in the
    # log.
    name: quick checks (docs, transform, REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: require CHANGELOG + HANDOFF + README
        run: |
          missing=0
          for f in CHANGELOG.md HANDOFF.md README.md CLAUDE.md; do
            [ -f "$f" ] || { echo "missing $f"; missing=1; }
          done
          exit $missing
      - name: transform unit test
        run: bash transform/tests/test_melt.sh
      # stdlib only (no numpy/torch): the layout-model label builders
      - name: layout-model training-set tests
        run: python3 -m unittest discover -s ml/tests -v
      - name: REUSE licensing lint
        uses: fsfe/reuse-action@v5

  corpus-goldens:
    # ~3,500 frozen tidy outputs of real tools: the only thing that catches a
    # parser change silently re-shaping another tool's output. ~3 min on 4
    # cores (job pool, --generic only); private-repo runners have 2, so the
    # timeout allows ~3x that.
    name: corpus goldens (tidy output of ~3,500 real tools)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/corpus/run.sh --golden

  extract-suite:
    name: extract strategy + engine suite
    runs-on: ubuntu-latest
    # ~2 min locally since the 2026-09-25 detection speed-up (it was 9-17 min
    # on CI runners before). 20 minutes leaves room for a slow runner while
    # still capping a hang far below GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash extract/tests/run_tests.sh

  analyze-engine:
    name: analyze engine suite
    runs-on: ubuntu-latest
    # two full runs (mawk, then gawk), ~2.5 min each on 4 cores
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's default awk is mawk, which is what most users have, so the
      # suite runs under mawk first; then again under gawk.
      - name: run engine tests (mawk)
        run: |
          awk -W version 2>&1 | head -1
          bash analyze/tests/run_tests.sh
      - name: install gawk
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gawk
          sudo update-alternatives --set awk /usr/bin/gawk
      - name: run engine tests (gawk)
        run: bash analyze/tests/run_tests.sh

  python-package:
    name: python package (pip / PyPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine pytest pytest-cov
      - name: launcher unit tests (100% coverage enforced)
        run: python -m pytest
      - name: build sdist + wheel
        run: python -m build
      - run: python -m twine check dist/*
      - name: install the wheel and run provost from it
        run: |
          python -m pip install dist/*.whl
          provost --version
          provost doctor
          export PROVOST_HOME="$RUNNER_TEMP/provosthome"
          # not a terminal, so both captures run in the foreground
          printf 'Filesystem Size Used\n/dev/sda1 50G 20G\n' | provost
          provost ls | grep aligned-columns
          provost run df -h
          provost show df
          # the layout model ships in the wheel: a gated capture it can read
          provost --model tests/benchmark/round3/inputs/005-cmake-cache-advanced-help.txt 2>&1 \
              | grep "strategy layout-model"
          # the LLM template runtime and its shipped templates are in the wheel
          provost --llm extract/samples/llm-template/basic.txt 2>&1 \
              | grep "strategy llm-template"

