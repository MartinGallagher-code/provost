name: CI

# NOTE: paths here are relative to the repo root. This file lives under provost/ in
# the upstream Envoy repo (where GitHub ignores it — only root .github/ runs) and
# becomes active once provost is extracted to its own repository.

on:
  push:
  pull_request:

jobs:
  smoke:
    name: smoke (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: provost doctor
        run: bash provost doctor || true
      - name: smoke test
        run: bash tests/smoke.sh

  transform:
    name: transform unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash transform/tests/test_melt.sh

  extract-suite:
    name: extract strategy + engine suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash extract/tests/run_tests.sh

  analyze-engine:
    name: analyze engine suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: use gawk (the analyze engine prefers it; Ubuntu defaults to mawk)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gawk
          sudo update-alternatives --set awk /usr/bin/gawk
      - name: run engine tests
        run: ENVOY_ANALYZE_SUPPRESS_AWK_WARNING=1 bash analyze/tests/run_tests.sh

  python-package:
    name: python package (pip / PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine pytest pytest-cov
      - name: launcher unit tests (100% coverage enforced)
        run: python -m pytest
      - name: build sdist + wheel
        run: python -m build
      - run: python -m twine check dist/*
      - name: install the wheel and run provost from it
        run: |
          python -m pip install dist/*.whl
          provost --version
          provost doctor
          printf 'Filesystem Size Used\n/dev/sda1 50G 20G\n' | PROVOST_HOME="$RUNNER_TEMP/provosthome" provost
          for i in $(seq 20); do
            PROVOST_HOME="$RUNNER_TEMP/provosthome" provost ls | grep -q aligned-columns && break
            sleep 1
          done
          PROVOST_HOME="$RUNNER_TEMP/provosthome" provost ls | grep aligned-columns

  reuse:
    name: REUSE licensing lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  docs:
    name: docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require CHANGELOG + HANDOFF + README
        run: |
          missing=0
          for f in CHANGELOG.md HANDOFF.md README.md CLAUDE.md; do
            [ -f "$f" ] || { echo "missing $f"; missing=1; }
          done
          exit $missing

  bundle:
    name: bundle.txt current
    runs-on: ubuntu-latest
    steps:
      # Needs the git index, not just a worktree: the check compares the
      # bundle's file list against `git ls-files`.
      - uses: actions/checkout@v4
      - name: bundle.txt lists exactly the tracked files
        run: bash tests/check-bundle-current.sh
