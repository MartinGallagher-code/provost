[package]
name = "my-app"
version = "0.3.1"
edition = "2021"
authors = ["Alice <alice@example.com>"]
description = "A high-performance web server"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
axum = "0.7"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio"] }
tracing = "0.1"

[[bin]]
name = "server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
