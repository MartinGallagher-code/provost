# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 Martin J. Gallagher
# MkDocs configuration — built by Read the Docs (see .readthedocs.yaml) and
# locally with `pip install -r docs/requirements.txt && mkdocs build --strict`.
site_name: provost
site_description: "Turn command output into data: capture, auto-detect the format, present as a tidy git-backed dataset"
site_url: https://provost.readthedocs.io
repo_url: https://github.com/MartinGallagher-code/provost
repo_name: MartinGallagher-code/provost
copyright: "Copyright &copy; 2026 Martin J. Gallagher — GPL-3.0-or-later"

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Usage: usage.md
  - Design:
      - Rename and simplification: 0001-rename-and-simplification.md
      - Tidy-first and nameless columns: 0002-tidy-first-and-nameless-columns.md
      - Multi-dataset capture: 0003-multi-dataset.md
      - The columnar-specs engine: columnar-specs-engine.md
  - Benchmark:
      - 50 held-out inputs: benchmark-2026-08-12-generalisation.md
      - "Round 2: 109 held-out inputs": benchmark-2026-10-02-generalisation-round2.md
      - "Round 3: 107 held-out inputs": benchmark-2026-10-16-generalisation-round3.md
      - "Round 4: 107 held-out inputs": benchmark-2026-10-20-generalisation-round4.md

markdown_extensions:
  - admonition
  - tables
  - fenced_code

# docs/archive/ holds the corpus review-round worksheets (TSV/TXT) and old
# plans -- working artefacts of the review process, not documentation pages;
# keep them out of the built site.
exclude_docs: |
  archive/
